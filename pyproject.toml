[project]
name = "audio-spectrum-app"
version = "0.2.0"
description = "Render audio spectrum videos on a chroma-key background, fully offline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "skia-python>=144.1",
    "soundfile>=0.14.0",
]

[project.scripts]
audio-spectrum = "audio_spectrum.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_spectrum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
